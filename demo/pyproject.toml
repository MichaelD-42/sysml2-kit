[project]
name = "explorer"
version = "0.1.0"
description = "Model explorer demo: a kit project's SysML v2 model and needs as a Neo4j graph"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "neo4j>=5.11,<6",
    "fastembed",
    "claude-agent-sdk",
    "sysml2kit",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["explorer"]

[tool.uv.sources]
sysml2kit = { path = "..", editable = true }
