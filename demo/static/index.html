<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model explorer</title>
<link rel="stylesheet" href="app.css">
<script>
  // theme choice, and every uncaught error or console.error as an inline banner (the page is debugged by eye)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  (() => {
    const show = (msg) => {
      const b = document.getElementById("banner");
      if (!b) return void addEventListener("DOMContentLoaded", () => show(msg));
      const p = document.createElement("p");
      p.textContent = msg;
      b.querySelector(".messages").append(p);
      b.hidden = false;
    };
    const error = console.error.bind(console);
    console.error = (...args) => (error(...args), show(args.map((a) => a?.message ?? String(a)).join(" ")));
    addEventListener("error", (e) => show(e.message || `failed to load ${e.target?.src ?? e.target?.href ?? "a resource"}`), true);
    addEventListener("unhandledrejection", (e) => show(e.reason?.message ?? String(e.reason)));
  })();
</script>
<script src="vendor/elk.bundled.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="banner" class="banner" role="alert" hidden>
  <div class="messages"></div>
  <button type="button" onclick="this.parentElement.hidden = true; this.previousElementSibling.replaceChildren()">Dismiss</button>
</div>
<header class="top">
  <button type="button" id="tree-toggle" aria-controls="tree-col" aria-expanded="true">Tree</button>
  <h1>Model explorer</h1>
  <details id="menu" class="menu">
    <summary>System Model</summary>
    <div class="menu-items" role="menu"></div>
  </details>
  <div class="actions">
    <button type="button" id="side-toggle" aria-controls="side" aria-expanded="false">Ask / Search</button>
    <button type="button" id="back" disabled>Back</button>
    <button type="button" id="reload">Rebuild and reload</button>
    <span id="reload-status" class="status" aria-live="polite"></span>
    <button type="button" id="theme" aria-label="Switch light or dark theme">Theme</button>
  </div>
</header>
<main class="grid">
  <nav class="col tree-col" id="tree-col" aria-label="Requirements, system architecture and platform">
    <details class="tree-part" data-section="req" open><summary><span role="heading" aria-level="2" id="req-h">Requirements</span></summary><div id="req-tree" aria-labelledby="req-h"></div></details>
    <details class="tree-part" data-section="rflp" open><summary><span role="heading" aria-level="2" id="rflp-h">System Architecture</span></summary><div id="rflp-tree" aria-labelledby="rflp-h"></div></details>
    <details class="tree-part" data-section="plat" open><summary><span role="heading" aria-level="2" id="plat-h">Platform</span></summary><div id="plat-tree" aria-labelledby="plat-h"></div></details>
  </nav>
  <section class="col view-col" aria-label="Diagram">
    <div class="title">
      <div id="inspector"></div>
      <nav id="breadcrumb" aria-label="Owner path"></nav>
    </div>
    <div id="kinds" role="tablist" aria-label="Views"></div>
    <p id="note" class="note" aria-live="polite"></p>
    <div class="stage">
      <div id="canvas" role="tabpanel" tabindex="-1"></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <span class="legend"><span class="domain d-ME">ME</span><span class="domain d-EE">EE</span><span class="domain d-SW">SW</span></span>
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-fit">Fit</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <details id="details" class="details"><summary>Details</summary><div id="details-body"></div></details>
  </section>
  <aside class="side-col" id="side" aria-label="Ask and search" hidden>
    <div id="side-tabs" role="tablist">
      <button type="button" role="tab" data-panel="ask" aria-selected="true">Ask</button>
      <button type="button" role="tab" data-panel="search" aria-selected="false">Search</button>
      <button type="button" id="side-close" class="close" aria-label="Close Ask and Search">×</button>
    </div>
    <section id="ask" class="side-panel" role="tabpanel"></section>
    <section id="search" class="side-panel" role="tabpanel" hidden></section>
  </aside>
</main>
</body>
</html>
