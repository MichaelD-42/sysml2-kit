# sphinx-needs and ubCode configuration for an RFLP project (read by conf.py via needs_from_toml).
# Model needs are generated by `sysml2kit needs`; customer requirements and acceptance tests are RST.

[needs]
id_required = true
# per-type id_regex below is the strict check; generated test result ids are lowercase
id_regex = "^[A-Za-z0-9_-]+$"
schema_definitions_from_json = "schemas.json"

[[needs.types]]
directive = "crs"
title = "Customer requirement"
prefix = "CRS-"
color = "#FEDCD2"
id_regex = "^CRS-[0-9]{3,}$"

[[needs.types]]
directive = "usecase"
title = "Use case"
prefix = "UC-"
color = "#C6A6D7"
id_regex = "^UC-[0-9]{3,}$"

[[needs.types]]
directive = "sysreq"
title = "System requirement"
prefix = "SR-"
color = "#BFD8D2"
id_regex = "^SR-[0-9]{3,}$"

[[needs.types]]
directive = "function"
title = "Function"
prefix = "F-"
color = "#A6BDD7"
id_regex = "^F-[0-9]{3,}$"

[[needs.types]]
directive = "component"
title = "Logical component"
prefix = "LC-"
color = "#DCB239"
id_regex = "^LC-[0-9]{3,}$"

[[needs.types]]
directive = "interface"
title = "Logical interface"
prefix = "LI-"
color = "#E6C88A"
id_regex = "^LI-[0-9]{3,}$"

[[needs.types]]
directive = "systest"
title = "System test case"
prefix = "STC-"
color = "#F2B8A2"
id_regex = "^STC-[0-9]{3,}$"

[[needs.types]]
directive = "acctest"
title = "Acceptance test case"
prefix = "ATC-"
color = "#F2D4A2"
id_regex = "^ATC-[0-9]{3,}$"

[[needs.types]]
directive = "swreq"
title = "Software requirement"
prefix = "SWR-"
color = "#D2E4FE"
id_regex = "^SWR-[0-9]{3,}$"

[[needs.types]]
directive = "testresult"
title = "Test result"
prefix = "testresult_"
color = "#DDDDDD"

[needs.links.satisfies]
incoming = "satisfied by"
outgoing = "satisfies"

[needs.links.realizes]
incoming = "realized by"
outgoing = "realizes"

[needs.links.verifies]
incoming = "verified by"
outgoing = "verifies"

[needs.links.allocated_to]
incoming = "allocates"
outgoing = "allocated to"

[needs.links.owned_by]
incoming = "owns"
outgoing = "owned by"

[needs.links.tests]
incoming = "test results"
outgoing = "result of"

# fields written by sysml2kit
[needs.fields.qualified_name]
description = "SysML qualified name"
nullable = true

[needs.fields.sysml_kind]
description = "SysML metaclass"
nullable = true

[needs.fields.source]
description = "Defining file and line"
nullable = true

[needs.fields.leaf]
description = "No child of the same need type"
nullable = true
schema = { type = "boolean" }

# fields written by `test-reports build needs`
[needs.fields.result]
description = "Test outcome"
nullable = true

[needs.fields.suite]
description = "Test suite"
nullable = true

[needs.fields.classname]
description = "Test class name"
nullable = true

[needs.fields.case]
description = "Test case"
nullable = true

[needs.fields.case_name]
description = "Test case name"
nullable = true

[needs.fields.file]
description = "Result file"
nullable = true

[needs.fields.time]
description = "Duration in seconds"
nullable = true

[needs.fields.case_file]
description = "Source file of the test"
nullable = true

[needs.fields.case_line]
description = "Source line of the test"
nullable = true

[needs.fields.case_parameter]
description = "Test parameters"
nullable = true

[needs.fields.remote_url]
description = "Link to the test source"
nullable = true

[needs.fields.result_text]
description = "Failure or skip message"
nullable = true
